[project]
name = "diffusers-dynamic-offloader"
version = "0.1.0"
description = "Model-agnostic dynamic offload helpers for Diffusers-style low-VRAM inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "diffusers",
    "safetensors",
    "accelerate",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

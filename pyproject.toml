[project]
name = "diffusers-dynamic-offloader"
version = "0.1.0"
description = "Model-agnostic dynamic offload helpers for Diffusers-style low-VRAM inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "diffusers",
    "safetensors",
    "accelerate",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.14.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "W", # pycodestyle warnings
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "B904", # Allow concise exception handling in small compatibility helpers.
    "E501", # Let the formatter and local readability handle occasional long lines.
    "RUF022", # Keep public __all__ grouped by API meaning instead of strict sorting.
]

[tool.ruff.lint.isort]
known-first-party = ["diffusers_dynamic_offloader"]

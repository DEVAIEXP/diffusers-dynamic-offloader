[project]
name = "diffusers-dynamic-offloader"
version = "0.1.0"
description = "Model-agnostic dynamic offload helpers for Diffusers-style low-VRAM inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "diffusers",
    "safetensors",
    "accelerate",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.14.3",
]
vmm = [
    "cuda-core>=1.2.0",
    "cuda-bindings>=13.4.0",
]
vmm-dev = [
    "pytest",
    "ruff>=0.14.3",
    "cuda-core>=1.2.0",
    "cuda-bindings>=13.4.0",
    "torch==2.12.1+cu132 ; sys_platform == 'win32' and python_version == '3.12'",
    # Optional Windows development harness dependencies. They keep the DDO
    # library itself model-agnostic while allowing its VMM contracts to be
    # exercised against the sibling Diffusers host environment.
    "torchvision==0.27.1+cu132 ; sys_platform == 'win32' and python_version == '3.12'",
    "accelerate==1.14.0",
    "transformers==5.15.1",
    "einops==0.8.2",
    "peft==0.20.0",
    "diffusers==0.41.0",
]
vmm-dev-linux = [
    "pytest",
    "ruff>=0.14.3",
    "cuda-core>=1.2.0",
    "cuda-bindings>=13.4.0",
    "cuda-toolkit[nvcc,cccl]==13.2.1 ; sys_platform == 'linux' and python_version == '3.12'",
    "torch==2.12.1+cu132 ; sys_platform == 'linux' and python_version == '3.12'",
    "torchvision==0.27.1+cu132 ; sys_platform == 'linux' and python_version == '3.12'",
    "accelerate==1.14.0",
    "transformers==5.15.1",
    "einops==0.8.2",
    "peft==0.20.0",
    "safetensors==0.8.0",
    "diffusers==0.41.0",
]

[dependency-groups]
# Checkout-only tools are not included in published Requires-Dist metadata.
vmm-harness = [
    "diffusers-mm @ git+https://github.com/asomoza/diffusers-mm.git@ec5a40f1b8279e86f2b8c7a1872018f213d441f6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ddo_vmm_bootstrap", "ddo_native_check"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32' and python_version == '3.12'" },
    { index = "pytorch-cu132", extra = "vmm-dev-linux", marker = "sys_platform == 'linux' and python_version == '3.12'" },
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32' and python_version == '3.12'" },
    { index = "pytorch-cu132", extra = "vmm-dev-linux", marker = "sys_platform == 'linux' and python_version == '3.12'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "W", # pycodestyle warnings
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "B904", # Allow concise exception handling in small compatibility helpers.
    "E501", # Let the formatter and local readability handle occasional long lines.
    "RUF022", # Keep public __all__ grouped by API meaning instead of strict sorting.
]

[tool.ruff.lint.isort]
known-first-party = ["diffusers_dynamic_offloader"]

[tool.pytest.ini_options]
markers = [
    "vmm: requires the native VMM allocator and CUDA.",
]
